name: Update Public Suffix List

# Proposes a new snapshot of the Public Suffix List as a pull request (decision 0003)
# and merges it when CI passes (decision 0019).
# How to run it and the repository setting it needs: docs/how-to/update-public-suffix-list.md

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: psl
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      SNAPSHOT: packages/mail/data/public_suffix_list.dat
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch the list
        run: >-
          curl --fail --silent --show-error --location --max-time 60
          --output "$RUNNER_TEMP/psl.dat"
          https://publicsuffix.org/list/public_suffix_list.dat

      - name: Check that it looks like the list
        id: check
        run: |
          list="$RUNNER_TEMP/psl.dat"
          # Only these characters, so the version is safe in a branch name.
          version=$(sed -n 's|^// VERSION: \([0-9A-Za-z_-]\{1,64\}\)$|\1|p' "$list" | head -n 1)
          test -n "$version"
          for marker in \
            '// ===BEGIN ICANN DOMAINS===' '// ===END ICANN DOMAINS===' \
            '// ===BEGIN PRIVATE DOMAINS===' '// ===END PRIVATE DOMAINS==='; do
            grep -qxF "$marker" "$list"
          done
          rules=$(grep -cv '^\(//.*\)\?$' "$list")
          test "$rules" -gt 5000
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "VERSION $version, $rules rules."

      - name: Propose the new snapshot and merge it when CI passes
        env:
          VERSION: ${{ steps.check.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$(dirname "$SNAPSHOT")"
          cp "$RUNNER_TEMP/psl.dat" "$SNAPSHOT"
          git add "$SNAPSHOT"
          if git diff --cached --quiet; then
            echo "The snapshot is already $VERSION."
            exit 0
          fi
          branch="psl/$VERSION"
          # DONE: a pull request from this branch was merged or closed, so this VERSION is settled.
          # OPEN: an earlier run did not merge it (CI failed, was cancelled, or timed out); try again.
          state=$(gh pr list --head "$branch" --state all --json state \
            --jq 'map(.state) | if any(. == "OPEN") then "OPEN" elif length > 0 then "DONE" else "" end')
          if [ "$state" = DONE ]; then
            echo "$VERSION was proposed already."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --create "$branch"
          git commit --quiet --message "Update the Public Suffix List to $VERSION"
          # A branch left by an earlier run is rebuilt on the current main.
          git push --force origin "$branch"
          sha=$(git rev-parse HEAD)
          # Pull requests opened with GITHUB_TOKEN start no workflows, so start CI on the branch.
          gh workflow run ci.yml --ref "$branch"
          if [ -z "$state" ]; then
            gh pr create --base main --head "$branch" \
              --title "Update the Public Suffix List to $VERSION" \
              --body "Snapshot of https://publicsuffix.org/list/public_suffix_list.dat, VERSION $VERSION. Opened by the Update Public Suffix List workflow, which merges it when CI passes (decision 0019)." \
              || { echo "::error::Could not open the pull request. See docs/how-to/update-public-suffix-list.md."; exit 1; }
          else
            echo "Trying the open pull request for $VERSION again."
          fi
          # Only the newest snapshot stays open, so an older one is never merged over it.
          gh pr list --state open --json number,headRefName \
            --jq ".[] | select(.headRefName | startswith(\"psl/\")) | select(.headRefName != \"$branch\") | .number" |
            while read -r number; do
              gh pr close "$number" --delete-branch --comment "Replaced by the snapshot $VERSION."
            done
          # Merges made with GITHUB_TOKEN start no workflows either (decision 0019):
          # wait for CI on this commit, merge exactly this commit, then start CI on main to deploy.
          run_id=
          for _ in $(seq 30); do
            run_id=$(gh run list --workflow ci.yml --branch "$branch" --event workflow_dispatch \
              --json databaseId,headSha --jq "map(select(.headSha == \"$sha\")) | .[0].databaseId // empty")
            [ -n "$run_id" ] && break
            sleep 10
          done
          test -n "$run_id" || { echo "::error::No CI run found for $sha. Run this workflow again."; exit 1; }
          # Under the job's 60 minutes, so the log says why it stopped.
          timeout 45m gh run watch "$run_id" --exit-status --interval 30 > /dev/null \
            || { echo "::error::CI did not pass in 45 minutes (failed, cancelled, or slow). The pull request stays open; run this workflow again to retry."; exit 1; }
          # --repo: merge on GitHub only; leave the local checkout alone.
          gh pr merge "$branch" --repo "$GITHUB_REPOSITORY" --squash --delete-branch --match-head-commit "$sha" \
            || { echo "::error::Could not merge. Merge by hand; see docs/how-to/update-public-suffix-list.md."; exit 1; }
          gh workflow run ci.yml --ref main
